<!DOCTYPE html>
<html lang="en" style="background-color: #1e1b4b;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Tour Manager</title>
    <meta name="description" content="Manage your tour expenses and group funds easily." />
    <meta name="theme-color" content="#1e1b4b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />

    <!-- PWA Icons -->
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- iOS PWA — makes it behave like a native app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TureManager" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0;
        padding: 0;
        background-color: #1e1b4b; /* Dark background to prevent white flash */
        width: 100%;
        height: 100%;
      }

      #splash-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #1e1b4b, #4f46e5, #2563eb);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .splash-logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        animation: splashPulse 1.8s infinite ease-in-out;
      }
      .splash-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .splash-text {
        margin-top: 20px;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .splash-sub {
        margin-top: 6px;
        color: rgba(255,255,255,0.5);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      @keyframes splashPulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0.2); }
        70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(255,255,255,0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
      }
    </style>
  </head>
  <body style="margin: 0; background-color: #1e1b4b;">
    <div id="splash-screen">
      <div class="splash-logo">
        <img src="/pwa-192x192.png" alt="TureManager" />
      </div>
      <div class="splash-text">TureManager</div>
      <div class="splash-sub">Tour · Budget · Team</div>
      <div style="margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.1); border-top-color: white; border-radius: 50%; animation: splashSpin 0.8s linear infinite;"></div>
        <div style="color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;">Loading...</div>
      </div>
    </div>
    <style>@keyframes splashSpin { to { transform: rotate(360deg); } }</style>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      window.addEventListener('load', () => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 600);
        }
      });
    </script>
  </body>
</html>
